# Demo PostgreSQL with sample data for PowDB.
#   standalone:  docker compose -f demo/docker-compose.yml up -d    (bun run demo:db)
#   or included by ../docker-compose.yml together with the app.
# Connection URL from your machine: postgresql://demo:demo@localhost:55432/shop
services:
  postgres:
    image: postgres:17-alpine
    container_name: powdb-demo
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: only passes once the init scripts are done and the real server listens
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U demo -d shop']
      interval: 3s
      timeout: 3s
      retries: 40

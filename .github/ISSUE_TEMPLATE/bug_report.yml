name: Bug report
description: Something in PowView does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove passwords, tokens and private data from anything you paste.
        For security problems, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a table with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PowView version
      description: Shown by `powview --version`, or the image tag you run (for example 0.1.0).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run PowView?
      options:
        - Docker image
        - npx / bunx
        - From source
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: '17'
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs (for example `docker logs powview`) or a screenshot.

# DEVELOPMENT stack: builds PowDBs from source and starts a demo PostgreSQL with sample data.
# To run the published image for everyday use, see compose.example.yml instead.
#
#   docker compose up -d --build      → http://localhost:3333
#   docker compose down               (add -v to also delete saved connections + demo data)
#
# The app container reaches:
#   - the demo database as      postgres:5432
#   - databases on your machine host.docker.internal:<port>   (they must listen on 0.0.0.0 / the docker bridge)
name: powdbs

include:
  - demo/docker-compose.yml # service "postgres" (demo database, also published on localhost:55432)

services:
  app:
    build: .
    image: powdbs:latest
    container_name: powdbs
    restart: unless-stopped
    ports:
      # only reachable from this machine; sign in at first start (see README, section Login)
      - '127.0.0.1:3333:3333'
    environment:
      # connections created on the very first start (one per line: "Name=postgresql://…")
      POWDBS_CONNECTIONS: |
        Demo shop=postgresql://demo:demo@postgres:5432/shop
      # creates the admin on first start when no admin exists yet (at least 8 characters)
      # POWDBS_ADMIN_PASSWORD: change-me-now
      # disables the login entirely; trusted local use only, anyone who can reach the port gets in
      # POWDBS_AUTH: "off"
      # passwords for connections declared in powdbs.yaml with password_env are read from
      # environment variables like this one. Keep real secrets in an .env file or your shell,
      # not in the YAML file.
      # PROD_PG_PASSWORD: ...
    volumes:
      - powdbs-data:/data
      # declarative connections, mounted read-only (see powdbs.example.yaml)
      # - ./powdbs.yaml:/data/powdbs.yaml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  powdbs-data:
